name: APG Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Local quality platform
        run: npm run quality:local
      - name: Build
        run: npm run build
      - name: Browser scanners
        run: |
          npm run preview -- --host 127.0.0.1 --port 4175 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4175 >/dev/null && break; sleep 1; done
          AUTH_LIFECYCLE_URLS=http://127.0.0.1:4175/ npm run test:auth-lifecycle
          npm run quality:browser
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apg-quality-report
          path: .quality/
          include-hidden-files: true
